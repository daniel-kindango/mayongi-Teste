<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Validação de Senha</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #333;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.05);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 30px;
            font-weight: bold;
            color: #fe2c55;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
        }

        input {
            padding: 12px;
            margin-bottom: 15px;
            width: 100%;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            outline: none;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: #f7245c;
            transform: scale(1.05);
        }

        #resultado, #quantidadeSenhas {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #resultado {
            color: #00c6ff;
        }

        #quantidadeSenhas {
            color: #ffa500;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Validação de Senha</h1>
    <p>Digite um número de 4 dígitos:</p>

    <input type="text" id="senha" maxlength="4" placeholder="Ex: 5203">

    <button onclick="validarSenha()">Validar Senha</button>

    <p id="resultado"></p>
    <p id="quantidadeSenhas"></p>
</div>

<script>
    function validarSenha() {
        const senha = document.getElementById('senha').value;
        const resultado = document.getElementById('resultado');
        const quantidadeSenhas = document.getElementById('quantidadeSenhas');

        if (senha.length !== 4 || isNaN(senha)) {
            resultado.textContent = "Por favor, insira exatamente 4 números.";
            resultado.style.color = "#ff4d4d"; // vermelho
            quantidadeSenhas.textContent = "";
            return;
        }

        const digitos = senha.split('').map(Number);

        const todosDiferentes = new Set(digitos).size === 4;
        const soma = digitos.reduce((a, b) => a + b, 0);
        const terminaComZero = digitos[3] === 0;

        if (todosDiferentes && soma === 10 && terminaComZero) {
            resultado.textContent = "Senha válida!";
            resultado.style.color = "#00c6ff"; // azul claro

            // Agora sim calcular e mostrar quantas senhas possíveis existem
            let totalSenhas = 0;
            for (let d1 = 0; d1 <= 9; d1++) {
                for (let d2 = 0; d2 <= 9; d2++) {
                    for (let d3 = 0; d3 <= 9; d3++) {
                        for (let d4 = 0; d4 <= 9; d4++) {
                            const senhaArray = [d1, d2, d3, d4];
                            const setDigitos = new Set(senhaArray);
                            const somaAtual = d1 + d2 + d3 + d4;

                            if (setDigitos.size === 4 && somaAtual === 10 && d4 === 0) {
                                totalSenhas++;
                            }
                        }
                    }
                }
            }
            quantidadeSenhas.textContent = `Existem ${totalSenhas} senhas possíveis.`;
        } else {
            resultado.textContent = "Senha inválida! Verifique as regras.";
            resultado.style.color = "#ff4d4d"; // vermelho
            quantidadeSenhas.textContent = ""; // Não mostra quantidade de senhas
        }
    }
</script>

</body>
</html>
